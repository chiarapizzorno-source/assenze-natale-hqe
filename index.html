<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HQ - Piano Festività Natalizie 2024</title>
  
  <!-- Google Fonts & Bootstrap 5.3 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- SheetJS per Export Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --xmas-red: #d42426;
      --xmas-deep-red: #8b0000;
      --xmas-gold: #f1c40f;
      --xmas-green: #1e4620;
      --glass-bg: rgba(20, 20, 35, 0.65);
      --glass-border: rgba(255, 255, 255, 0.15);
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #0f0c1b;
      color: #f8f9fa;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Sfondo Anime/Christmas Dynamic Layer */
    .bg-anime {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 30%, #1a1c38 0%, #0a0a12 100%);
      z-index: -2;
    }

    /* Canvas Neve */
    #snowCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: -1;
    }

    /* SVG Babbo Natale Volante */
    .santa-container {
      position: fixed;
      top: 10%;
      left: -200px;
      width: 180px;
      z-index: 0;
      pointer-events: none;
      animation: flySanta 25s linear infinite;
      opacity: 0.85;
    }

    @keyframes flySanta {
      0% { transform: translateX(0) translateY(0) rotate(2deg); left: -200px; }
      25% { transform: translateX(35vw) translateY(15px) rotate(-1deg); }
      50% { transform: translateX(70vw) translateY(-10px) rotate(3deg); }
      75% { transform: translateX(105vw) translateY(20px) rotate(-2deg); }
      100% { transform: translateX(120vw) translateY(0) rotate(0deg); left: -200px; }
    }

    /* Font Titoli Natalizi */
    .font-cinzel {
      font-family: 'Cinzel', serif;
    }

    /* Card Vetro 3D Glossy */
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .glass-card:hover {
      box-shadow: 0 12px 40px 0 rgba(212, 36, 38, 0.25);
    }

    .btn-xmas {
      background: linear-gradient(135deg, var(--xmas-red) 0%, var(--xmas-deep-red) 100%);
      color: #fff;
      border: 1px solid var(--xmas-gold);
      font-weight: 600;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(212, 36, 38, 0.4);
      transition: all 0.3s ease;
    }

    .btn-xmas:hover {
      background: linear-gradient(135deg, #e62e31 0%, #a00000 100%);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(212, 36, 38, 0.6);
    }

    .form-control, .form-select {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff !important;
      border-radius: 10px;
    }

    .form-control:focus, .form-select:focus {
      background: rgba(255, 255, 255, 0.15);
      border-color: var(--xmas-gold);
      box-shadow: 0 0 10px rgba(241, 196, 15, 0.3);
    }

    .form-select option {
      background: #1a1c38;
      color: #fff;
    }

    /* Tasti Audio e Toggle */
    .audio-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
      border-radius: 50px;
      padding: 10px 20px;
    }

    .table-dark-glass {
      --bs-table-bg: transparent;
      --bs-table-color: #fff;
      border-color: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>

  <div class="bg-anime"></div>
  <canvas id="snowCanvas"></canvas>

  <!-- Babbo Natale Volante -->
  <div class="santa-container">
    <svg viewBox="0 0 200 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 50 Q 50 20, 80 50 T 140 50" stroke="#f1c40f" stroke-width="2" fill="none"/>
      <circle cx="150" cy="45" r="12" fill="#d42426"/>
      <circle cx="160" cy="42" r="5" fill="#fff"/>
      <path d="M140 55 C140 65, 160 65, 160 55 Z" fill="#8b0000"/>
    </svg>
  </div>

  <div class="container py-5">
    <!-- Header -->
    <header class="text-center mb-5">
      <h1 class="display-4 font-cinzel text-warning fw-bold mb-2">HQ - Piano Festività Natalizie</h1>
      <p class="text-light opacity-75">Pianificazione Presenze & Ferie HQ</p>
    </header>

    <!-- Sezione Auth / Login -->
    <div id="authSection" class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="glass-card p-4 p-md-5">
          <h3 class="font-cinzel text-center text-white mb-4">Accesso Portale</h3>
          <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-3">
              <label for="emailInput" class="form-label text-light">Email Aziendale</label>
              <input type="email" class="form-control" id="emailInput" placeholder="nome.cognome@azienda.it" required>
            </div>
            <div class="mb-3 d-none" id="passwordGroup">
              <label for="passwordInput" class="form-label text-light">Password Admin</label>
              <input type="password" class="form-control" id="passwordInput" placeholder="******">
            </div>
            <button type="submit" class="btn btn-xmas w-100 py-2 mt-3">Accedi</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Sezione User Dashboard (Nascosta di default) -->
    <div id="userDashboard" class="d-none">
      <div class="glass-card p-4 mb-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4 class="font-cinzel text-warning m-0">Inserimento Piano Ferie</h4>
          <span class="badge bg-danger fs-6" id="userNameBadge">Utente</span>
        </div>
        <form id="holidayForm" onsubmit="handleHolidaySubmit(event)">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label text-light">Seleziona Giorni (Max consigliati: 4)</label>
              <div class="form-check text-light">
                <input class="form-check-input" type="checkbox" value="2024-12-24" id="d24">
                <label class="form-check-label" for="d24">24 Dicembre (Vigilia)</label>
              </div>
              <div class="form-check text-light">
                <input class="form-check-input" type="checkbox" value="2024-12-28" id="d28">
                <label class="form-check-label" for="d28">28 Dicembre</label>
              </div>
              <div class="form-check text-light">
                <input class="form-check-input" type="checkbox" value="2024-12-29" id="d29">
                <label class="form-check-label" for="d29">29 Dicembre</label>
              </div>
              <div class="form-check text-light">
                <input class="form-check-input" type="checkbox" value="2024-12-30" id="d30">
                <label class="form-check-label" for="d30">30 Dicembre</label>
              </div>
              <div class="form-check text-light">
                <input class="form-check-input" type="checkbox" value="2024-12-31" id="d31">
                <label class="form-check-label" for="d31">31 Dicembre</label>
              </div>
            </div>
            <div class="col-md-6">
              <label for="userNotes" class="form-label text-light">Note Operative</label>
              <textarea class="form-control" id="userNotes" rows="4" placeholder="Eventuali note sul reperibilità o passaggi di consegne..."></textarea>
            </div>
          </div>
          <button type="submit" class="btn btn-xmas mt-4">Invia Selezione</button>
        </form>
      </div>
    </div>

    <!-- Sezione Admin Dashboard (Nascosta di default) -->
    <div id="adminDashboard" class="d-none">
      <div class="glass-card p-4 mb-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h3 class="font-cinzel text-warning m-0">Pannello Amministrazione</h3>
          <button class="btn btn-outline-light btn-sm" onclick="exportToExcel()">📊 Esporta Excel</button>
        </div>

        <!-- Form Aggiunta Collaboratore -->
        <form id="addWorkerForm" onsubmit="handleAddWorker(event)" class="row g-3 mb-4 p-3 style-glass-sub">
          <div class="col-md-3">
            <input type="text" class="form-control" id="newWorkerName" placeholder="Nome Cognome" required>
          </div>
          <div class="col-md-3">
            <input type="email" class="form-control" id="newWorkerEmail" placeholder="Email" required>
          </div>
          <div class="col-md-2">
            <input type="text" class="form-control" id="newWorkerBU" placeholder="BU / Team" required>
          </div>
          <div class="col-md-2">
            <input type="number" class="form-control" id="newWorkerMax" placeholder="Max Giorni" value="4" required>
          </div>
          <div class="col-md-2">
            <button type="submit" class="btn btn-xmas w-100">+ Aggiungi</button>
          </div>
        </form>

        <!-- Tabella Risultati -->
        <div class="table-responsive">
          <table class="table table-dark-glass align-middle" id="adminTable">
            <thead>
              <tr>
                <th>Collaboratore</th>
                <th>BU / Team</th>
                <th>Giorni Richiesti</th>
                <th>Note</th>
                <th>Stato</th>
              </tr>
            </thead>
            <tbody id="adminTableBody">
              <!-- Popolato dinamicamente via JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Pulsante Toggle Musica Natalizia -->
  <button id="musicToggleBtn" class="btn btn-xmas audio-btn" onclick="toggleAudio()">🎵 Musica: OFF</button>

  <script>
    // --- ANIMAZIONE NEVE ---
    const canvas = document.getElementById('snowCanvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const numFlakes = 80;
    const flakes = Array.from({ length: numFlakes }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      r: Math.random() * 3 + 1,
      d: Math.random() * 1 + 0.5
    }));

    function drawSnow() {
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.beginPath();
      for (let f of flakes) {
        ctx.moveTo(f.x, f.y);
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      }
      ctx.fill();
      moveSnow();
      requestAnimationFrame(drawSnow);
    }

    function moveSnow() {
      for (let f of flakes) {
        f.y += Math.pow(f.r, 0.8) * 0.5;
        f.x += Math.sin(f.y / 30);
        if (f.y > height) {
          f.y = -10;
          f.x = Math.random() * width;
        }
      }
    }
    drawSnow();

    // --- GESTIONE AUTH & INTERFACCIA ---
    const emailInput = document.getElementById('emailInput');
    const passwordGroup = document.getElementById('passwordGroup');

    emailInput.addEventListener('input', (e) => {
      if (e.target.value.toLowerCase() === 'admin@azienda.it') {
        passwordGroup.classList.remove('d-none');
      } else {
        passwordGroup.classList.add('d-none');
      }
    });

    function handleLogin(e) {
      e.preventDefault();
      const email = emailInput.value.toLowerCase();
      document.getElementById('authSection').classList.add('d-none');

      if (email === 'admin@azienda.it') {
        document.getElementById('adminDashboard').classList.remove('d-none');
        renderAdminTable();
      } else {
        document.getElementById('userDashboard').classList.remove('d-none');
        document.getElementById('userNameBadge').innerText = email.split('@')[0];
      }
    }

    // --- MOCK DATA ADMIN & EXCEL ---
    const mockWorkers = [
      { name: "Mario Rossi", bu: "IT HQ", days: "24, 28, 29, 30", notes: "Passaggio consegne ok", status: "Inviato" },
      { name: "Laura Bianchi", bu: "HR", days: "28, 29, 30", notes: "-", status: "Inviato" }
    ];

    function renderAdminTable() {
      const tbody = document.getElementById('adminTableBody');
      tbody.innerHTML = mockWorkers.map(w => `
        <tr>
          <td>${w.name}</td>
          <td>${w.bu}</td>
          <td>${w.days}</td>
          <td>${w.notes}</td>
          <td><span class="badge bg-success">${w.status}</span></td>
        </tr>
      `).join('');
    }

    function handleAddWorker(e) {
      e.preventDefault();
      const name = document.getElementById('newWorkerName').value;
      const bu = document.getElementById('newWorkerBU').value;
      mockWorkers.push({ name, bu, days: "Da selezionare", notes: "-", status: "In Attesa" });
      renderAdminTable();
      e.target.reset();
    }

    function handleHolidaySubmit(e) {
      e.preventDefault();
      alert("Richiesta salvata con successo!");
    }

    function exportToExcel() {
      const ws = XLSX.utils.json_to_sheet(mockWorkers);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Piano Ferie");
      XLSX.writeFile(wb, "Piano_Ferie_Natalizie_HQ.xlsx");
    }

    // --- MODULO AUDIO (WEB AUDIO API - JINGLE BELLS) ---
    let audioCtx = null;
    let isPlaying = false;
    let audioInterval = null;

    const jingleBellsNotes = [
      { note: 329.63, duration: 250 }, { note: 329.63, duration: 250 }, { note: 329.63, duration: 500 },
      { note: 329.63, duration: 250 }, { note: 329.63, duration: 250 }, { note: 329.63, duration: 500 },
      { note: 329.63, duration: 250 }, { note: 392.00, duration: 250 }, { note: 261.63, duration: 250 }, { note: 293.66, duration: 250 },
      { note: 329.63, duration: 1000 }
    ];

    function playTone(freq, duration) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + (duration / 1000));
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + (duration / 1000));
      } catch (e) {
        console.error("Errore durante la riproduzione del tono:", e);
      }
    }

    function startMusic() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      
      let noteIndex = 0;
      isPlaying = true;

      function playNextNote() {
        if (!isPlaying) return;
        const current = jingleBellsNotes[noteIndex];
        playTone(current.note, current.duration);
        
        noteIndex = (noteIndex + 1) % jingleBellsNotes.length;
        audioInterval = setTimeout(playNextNote, current.duration);
      }

      playNextNote();
    }

    function stopMusic() {
      isPlaying = false;
      if (audioInterval) clearTimeout(audioInterval);
    }

    function toggleAudio() {
      const btn = document.getElementById('musicToggleBtn');
      if (isPlaying) {
        stopMusic();
        btn.innerText = '🎵 Musica: OFF';
      } else {
        startMusic();
        btn.innerText = '🔊 Musica: ON';
      }
    }
  </script>
</body>
</html>
